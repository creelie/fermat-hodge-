name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.7'
      - name: Run the Julia checks
        run: julia --startup-file=no julia/run_all.jl
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG: Hodge Classes on K3 Powers and Sixfolds" --notes "Hodge Classes on K3 Powers and Sixfolds. Lean 4 file (90 theorems) and Julia checks (842) for the paper."
