name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.7'
      - name: Run the Julia checks
        run: julia --startup-file=no julia/run_all.jl
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" papers/HodgePaper.pdf --target "$GITHUB_SHA" --title "$TAG" --notes "Two Abelian Statements Equivalent to the Hodge Conjecture. Paper, Lean 4 file (63 theorems) and Julia checks (665)."
