name: Publish complete Hodge v7
on:
  push:
    branches: [main]
    paths: [papers/release-request.json, papers/archive-imprint.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact controls and reviewed assets
        run: |
          python papers/checks/check_weights.py
          python papers/checks/check_transfer.py
          cd publication-v31
          sha256sum -c SHA256SUMS-v3.1.0.txt
          python -m zipfile -t texfinal.zip
      - name: Publish new research version or refresh DOI imprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import json; print(json.load(open("papers/release-request.json"))["tag"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" publication-v31/* --clobber
            gh release edit "$tag" --title "Algebraic Transfer and Propagation of Hodge Classes ($tag)" --notes-file papers/RELEASE-NOTES.md
          else
            gh release create "$tag" publication-v31/* --target "$(git rev-parse HEAD)" --title "Algebraic Transfer and Propagation of Hodge Classes ($tag)" --notes-file papers/RELEASE-NOTES.md
          fi
